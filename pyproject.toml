[project]
name = "finalproject-nikolaev-m26-555"
version = "0.1.0"
description = "Консольное приложение валютного кошелька"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["prettytable>=3.18.0"]

[project.scripts]
wallet = "valutatrade_hub.cli.interface:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "valutatrade_hub"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.valutatrade]
data_dir = "data"
rates_ttl_seconds = 300
default_base_currency = "USD"
log_file = "logs/actions.log"
log_format = "%(levelname)s %(asctime)s %(message)s"
log_level = "INFO"
log_max_bytes = 1048576
log_backup_count = 3

[dependency-groups]
dev = ["ruff>=0.17.0"]
